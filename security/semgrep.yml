rules:
  - id: ff-no-eval
    languages: [typescript, javascript]
    severity: ERROR
    message: >
      Avoid eval() — it executes arbitrary code and is a common injection sink.
    pattern: eval(...)

  - id: ff-no-document-write
    languages: [typescript, javascript]
    severity: ERROR
    message: >
      document.write() is an XSS sink and blocks rendering. Build DOM/JSX instead.
    pattern: document.write(...)

  - id: ff-no-child-process
    languages: [typescript, javascript]
    severity: ERROR
    message: >
      The web app must not spawn OS processes. If you need this, it belongs in a
      dedicated, reviewed server task — not in app/ or lib/.
    pattern-either:
      - pattern: require("child_process")
      - pattern: import "child_process"
      - pattern: import $X from "child_process"
      - pattern: import * as $X from "child_process"
      - pattern: import { ... } from "child_process"

  - id: ff-no-hardcoded-service-role
    languages: [typescript, javascript]
    severity: ERROR
    message: >
      Never hardcode a Supabase service-role JWT. Read it from the environment
      (SUPABASE_SERVICE_ROLE_KEY) on the server only.
    # service-role JWTs carry this claim; match the literal token, not env reads.
    pattern-regex: '"role"\s*:\s*"service_role"'

global:
  scrape_interval: 60s
  evaluation_interval: 60s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: farmersfresh
    scheme: https
    metrics_path: /api/operations/metrics
    scrape_timeout: 10s
    authorization:
      credentials_file: /run/secrets/monitoring_token
    static_configs:
      - targets: [farmersfresh.vercel.app]

# Copy to secrets/alertmanager.yml and replace the non-secret SMTP/recipient settings.
# Keep the SMTP password in secrets/smtp_password; both files are ignored by Git.
global:
  smtp_smarthost: 'smtp.example.invalid:587'
  smtp_from: 'alerts@example.invalid'
  smtp_auth_username: 'alerts@example.invalid'
  smtp_auth_password_file: /run/secrets/smtp_password
  smtp_require_tls: true
route:
  receiver: operations-email
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: operations-email
    email_configs:
      - to: 'owner@example.invalid'
        send_resolved: true

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    secrets: [monitoring_token]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.2.3
    ports: ["127.0.0.1:3100:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboard.json:/var/lib/grafana/dashboards/business.json:ro
      - grafana-data:/var/lib/grafana
    secrets: [grafana_password]
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.34.1
    profiles: [alerts]
    ports: ["127.0.0.1:9093:9093"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager", "--cluster.listen-address="]
    volumes:
      - ./secrets/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    secrets: [smtp_password]
    restart: unless-stopped
secrets:
  monitoring_token:
    file: ./secrets/monitoring_token
  grafana_password:
    file: ./secrets/grafana_password
  smtp_password:
    file: ./secrets/smtp_password
volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:

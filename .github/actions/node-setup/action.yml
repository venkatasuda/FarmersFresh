name: Locked Node dependencies
description: Install the exact npm lockfile with a fixed Node runtime
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.23.2'
        cache: npm
    - run: npm ci
      shell: bash
